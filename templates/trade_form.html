<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}} - Trading Journal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-graph-up-arrow text-primary me-2"></i>Trading Journal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/trades"><i class="bi bi-journal-text me-1"></i>Trades</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="/trades/new"><i class="bi bi-plus-circle me-1"></i>Add Trade</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="navbar-text me-3 text-light">
                            <i class="bi bi-person-circle me-1"></i>{{username}}
                        </span>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light btn-sm" href="/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex align-items-center mb-3">
                    <a href="/trades" class="btn btn-outline-secondary btn-sm me-3">
                        <i class="bi bi-arrow-left me-1"></i>Back
                    </a>
                    <h2 class="fw-bold mb-0">{{page_title}}</h2>
                </div>

                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        {{#error}}
                        <div class="alert alert-danger py-2 small mb-4" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>{{error}}
                        </div>
                        {{/error}}

                        <form method="POST" action="{{form_action}}">
                            <div class="row g-3">
                                <!-- Ticker & Direction -->
                                <div class="col-md-6">
                                    <label for="ticker" class="form-label fw-semibold">Ticker Symbol</label>
                                    <input type="text" class="form-control text-uppercase" id="ticker" name="ticker" placeholder="e.g. AAPL" value="{{ticker}}" required autofocus>
                                </div>
                                <div class="col-md-6">
                                    <label for="direction" class="form-label fw-semibold">Direction</label>
                                    <select class="form-select" id="direction" name="direction" required>
                                        <option value="Long" {{#is_long}}selected{{/is_long}}>Long (Buy Low, Sell High)</option>
                                        <option value="Short" {{#is_short}}selected{{/is_short}}>Short (Sell High, Buy Low)</option>
                                    </select>
                                </div>

                                <!-- Entry & Exit Prices -->
                                <div class="col-md-6">
                                    <label for="entryPrice" class="form-label fw-semibold">Entry Price ($)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" step="any" min="0.0001" class="form-control" id="entryPrice" name="entryPrice" placeholder="0.00" value="{{entry}}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="exitPrice" class="form-label fw-semibold">Exit Price ($)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" step="any" min="0.0001" class="form-control" id="exitPrice" name="exitPrice" placeholder="0.00" value="{{exit}}" required>
                                    </div>
                                </div>

                                <!-- Quantity, Fees, Trade Date -->
                                <div class="col-md-4">
                                    <label for="quantity" class="form-label fw-semibold">Quantity / Shares</label>
                                    <input type="number" step="1" min="1" class="form-control" id="quantity" name="quantity" placeholder="1" value="{{quantity}}" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="fees" class="form-label fw-semibold">Commission & Fees ($)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" step="any" min="0" class="form-control" id="fees" name="fees" placeholder="0.00" value="{{fees}}">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label for="tradeDate" class="form-label fw-semibold">Trade Date</label>
                                    <input type="date" class="form-control" id="tradeDate" name="tradeDate" value="{{tradeDate}}" required>
                                </div>

                                <!-- Notes -->
                                <div class="col-12">
                                    <label for="notes" class="form-label fw-semibold">Strategy & Setup Notes</label>
                                    <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Setup trigger, risk management, lessons learned...">{{notes}}</textarea>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-end gap-2">
                                <a href="/trades" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-check-lg me-1"></i>Save Trade Record
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3 mt-auto text-center text-muted small">
        <div class="container">
            Trading Journal (C++17 & Crow) &copy; 2026.
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
